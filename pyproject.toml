[project]
name = "plataforma-predictiva"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["contratos", "agentes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
