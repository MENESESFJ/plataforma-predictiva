[project]
name = "plataforma-predictiva"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "pandas", "numpy", "pyyaml>=6", "mlflow-skinny"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["contratos", "agentes", "core", "inferencia", "estado", "trazabilidad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
