# Contrato del dataset – motor diésel CAEX (Fase 2)
#
# Define qué datos debe entregar el Agente Datos, de qué fuente sale cada uno y cómo se
# aplica la fecha de corte (point-in-time). Las variables son las que usa el FMEA aprobado
# (components/motor_diesel/fmea.json); un test verifica que ambos estén alineados.
#
# Marcas: CONFIRMADO · SUPUESTO_DISENO · POR_CONFIRMAR / por_validar.
# Las familias de fuente vienen de la descripción del proyecto y deben validarse con el
# responsable antes de construir consultas.
version: "0.2.0"
estado: borrador
componente: motor_diesel

# Unidad de despliegue (multitenancy): baseline, parámetros, features, modelos, reglas
# calibradas, validación y FMEA aplicable existen por contrato + modelo_equipo + componente.
tenant:
  contrato: DMH                 # CONFIRMADO
  modelo_equipo: "798 AC"       # CONFIRMADO
  componente: motor_diesel      # CONFIRMADO
  universo_equipos: 12          # CONFIRMADO

# Reglas de acceso a datos corporativos
acceso:
  modo: solo_lectura            # CONFIRMADO: no se modifican pipelines ni el orquestador corporativo
  capas_origen: [bronze, silver]  # CONFIRMADO (Databricks)
  datasets_derivados: propios del proyecto, versionados por dataset_id   # SUPUESTO_DISENO
  ubicacion_datasets_derivados: Data Lake vía Databricks   # CONFIRMADO
  ubicacion_resultados: Data Lake vía Databricks           # CONFIRMADO (fuente de verdad para Power BI)
  formato_tablas: POR_CONFIRMAR                            # SUPUESTO_DISENO: Delta, estándar de Databricks
  esquema_o_catalogo: POR_CONFIRMAR

# Cadena de homologación. Cada variable canónica debe poder rastrearse hasta su campo físico.
# Los nombres físicos (tabla, campo) no se asumen: se completan al validar las fuentes.
homologacion:
  cadena: [fuente, campo_fisico, variable_canonica, feature, modo_fmea]
  registro_campos_fisicos: knowledge/fuentes/silver_798.yaml   # perfil y mapeo de los datasets Silver "_798"
  clave_equipo: SerialNumber   # SUPUESTO: estable entre datasets; el código de equipo varía de formato
  componente_motor: "1000.00.CC.0 MOTOR"   # código SMCS del motor en los datasets Silver
  componente_motor_sos_bronze: ENG         # CONFIRMADO: en SOS el motor viene como "ENG"

# Prioridad entre familias cuando una variable existe en más de una (CONFIRMADO, 2026-10-14).
# Argos y Argos Clone se están congelando por el traspaso a otros sistemas; la mayor parte de
# lo que capturaban ya lo captura Foresight.
prioridad_fuentes:
  orden: [Foresight, AMT, contratos, Argos, Argos Clone]   # Foresight primero; Argos solo si no hay equivalente
  regla: "Si una variable existe en Foresight y en Argos/Argos Clone, se usa Foresight."
  argos_congelado: >-
    Toda variable que hoy dependa solo de Argos/Argos Clone queda en riesgo de quedarse sin
    datos nuevos; se registra como riesgo y se busca su equivalente en Foresight.
  diccionarios_argos: "Se usan solo como referencia de nombres y homologación, no como datos."

# Los archivos del lake mezclan componentes, contratos y modelos. Todo dataset se filtra antes de usarse.
filtro_alcance:
  modelo: "SerialNumber / Numero Serie / Serie empieza con 'SKH' (798AC)"     # CONFIRMADO
  contrato: >-
    Equipo de DMH: código 'MH' + número, con o sin guion según el sistema ('MH340' o 'MH-340').
    Se filtra por la lista de series de la flota (knowledge/fuentes/bronze_798.yaml), no por el código.   # CONFIRMADO
  componente: "Silver: Componente = '1000.00.CC.0 MOTOR' · SOS bronze: Componente = 'ENG'"   # CONFIRMADO
  filas_sin_componente: excluir   # no se pueden asignar a motor

claves:
  contrato: "Contrato / faena (p. ej. DMH)"
  equipo_id: "Identificador único del camión"
  componente_serie: "Número de serie del motor instalado (para ciclo de vida y censura)"
  fecha: "Marca temporal del dato en UTC"

fuentes:
  sos:
    descripcion: Análisis de aceite de laboratorio
    familias_candidatas: [SOS / APD]          # por_validar
    tablas: [bronze/foresight/798/datasetSOS798.csv, "silver ds_<elemento>_798"]   # ver knowledge/fuentes/bronze_798.yaml
    granularidad: por muestra
    fecha_evento: fecha_muestra
    # La tabla no trae fecha de informe. El "Id Lab." codifica una fecha 0-10 días posterior a la
    # muestra (mediana 3): SUPUESTO = ingreso al laboratorio. Margen hasta el informe POR_CONFIRMAR.
    fecha_disponible: fecha_id_lab + margen_informe_dias
    margen_informe_dias: POR_CONFIRMAR
    regla_corte: "usar solo muestras con fecha_id_lab + margen_informe_dias <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  particulado:
    descripcion: Inspección de filtros, rejillas y patch test
    riesgo: "Hoy sale de Argos, que se está congelando; buscar equivalente en Foresight"   # CONFIRMADO
    familias_candidatas: [inspecciones de particulado, Cat Inspect]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por inspección
    fecha_evento: fecha_inspeccion
    fecha_disponible: fecha_registro
    regla_corte: "usar solo registros con fecha_registro <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  vims:
    descripcion: Parámetros (tendencias) y eventos del sistema de monitoreo del camión
    familias_candidatas: [VIMS eventos, VIMS tendencias]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: POR_CONFIRMAR       # tendencias resumidas o eventos; se agregará a diario
    fecha_evento: timestamp
    fecha_disponible: fecha_descarga
    regla_corte: "usar solo datos con fecha_descarga <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  ot:
    descripcion: Mantenimiento, fallas de componentes y códigos SMCS
    familias_candidatas: [mantenimiento, fallas de componentes, SMCS]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por orden
    fecha_evento: fecha_inicio_falla
    fecha_disponible: fecha_cierre_ot
    regla_corte: "como variable, solo OT cerradas antes de fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  horometro:
    descripcion: Horas de operación acumuladas por equipo y por motor
    familias_candidatas: [horas del equipo]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: diaria
    fecha_evento: fecha
    fecha_disponible: fecha
    regla_corte: "usar solo lecturas con fecha <= fecha_corte; debe ser monótono creciente"
    responsable_acceso: POR_CONFIRMAR
  ciclo_vida_componente:
    descripcion: Instalación y retiro de motores por equipo (con causa del cambio)
    familias_candidatas: [fecha de instalación de componentes, cambios de motor]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por movimiento
    fecha_evento: fecha_movimiento
    fecha_disponible: fecha_registro
    regla_corte: "define la ventana de vida de cada motor; los retirados sin falla son censurados"
    responsable_acceso: POR_CONFIRMAR
  rellenos:
    descripcion: Rellenos de aceite y refrigerante (consumo)
    familias_candidatas: [rellenos]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por relleno
    fecha_evento: fecha_relleno
    fecha_disponible: fecha_registro
    regla_corte: "usar solo registros con fecha_registro <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  detenciones:
    descripcion: Detenciones del equipo
    familias_candidatas: [detenciones]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por detención
    fecha_evento: fecha_inicio
    fecha_disponible: fecha_registro
    regla_corte: "usar solo registros con fecha_registro <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  operacionales:
    descripcion: Variables operacionales (carga, ciclos, condiciones de operación)
    familias_candidatas: [variables operacionales]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: POR_CONFIRMAR
    fecha_evento: timestamp
    fecha_disponible: fecha_registro
    regla_corte: "usar solo datos con fecha_registro <= fecha_corte"
    responsable_acceso: POR_CONFIRMAR
  afa_rca:
    descripcion: Análisis de falla (AFA) y de causa raíz (RCA) de los cambios de motor
    familias_candidatas: [AFA, RCA]   # por_validar
    tablas: POR_CONFIRMAR
    granularidad: por evento
    fecha_evento: fecha_evento
    fecha_disponible: fecha_emision
    uso_permitido: [etiquetado, validacion, contraste_fmea]
    prohibido_como_predictor: true    # CONFIRMADO: se generan después del evento
    regla_corte: "nunca como variable; solo para etiquetar y validar resultados"
    responsable_acceso: POR_CONFIRMAR

# Familias de fuente: asignación según el inventario del lake (knowledge/fuentes/lake_predictivo40.yaml).
# Foresight -> vims, sos, rellenos, operacionales · Argos -> particulado · AMT -> ot ·
# contratos -> ciclo_vida_componente (todas SUPUESTO, deducidas de nombres de archivo).
# Prioridad: Foresight sobre Argos/Argos Clone (ver prioridad_fuentes).
familias_sin_asignar:
  - API CAT      # no aparece en el lake
  - Cat Inspect  # no aparece en el lake

# Variables de condición que consume el FMEA. unidad = unidad canónica del dataset; si la
# fuente entrega otra (p. ej. psi o °F), el Agente Datos convierte.
variables:
  # --- Análisis de aceite (SOS)
  fe_ppm:      {fuente: sos, unidad: ppm, descripcion: Hierro en aceite}
  cu_ppm:      {fuente: sos, unidad: ppm, descripcion: Cobre en aceite}
  pb_ppm:      {fuente: sos, unidad: ppm, descripcion: Plomo en aceite}
  na_ppm:      {fuente: sos, unidad: ppm, descripcion: Sodio en aceite}
  k_ppm:       {fuente: sos, unidad: ppm, descripcion: Potasio en aceite}
  si_ppm:      {fuente: sos, unidad: ppm, descripcion: Silicio en aceite}
  pqi:         {fuente: sos, unidad: indice, descripcion: Particle Quantifier Index}
  hollin:      {fuente: sos, unidad: "%", descripcion: Hollín en aceite}
  viscosidad:  {fuente: sos, unidad: cSt, descripcion: "Viscosidad cinemática a 100 °C (temperatura de referencia por confirmar)"}
  # --- Inspección de particulado
  particulado_inspeccion: {fuente: particulado, unidad: nivel, descripcion: "Nivel o presencia de partículas metálicas (escala pendiente: síntoma SIN-013)"}
  # --- VIMS
  presion_aceite:            {fuente: vims, unidad: kPa, descripcion: Presión de aceite del motor}
  presion_carter:            {fuente: vims, unidad: kPa, descripcion: Presión de cárter (blowby)}
  temp_refrigerante:         {fuente: vims, unidad: "°C", descripcion: Temperatura del refrigerante}
  temp_aceite:               {fuente: vims, unidad: "°C", descripcion: Temperatura del aceite del motor}
  presion_refrigerante:      {fuente: vims, unidad: kPa, descripcion: Presión del sistema de refrigeración}
  nivel_refrigerante:        {fuente: vims, unidad: nivel, descripcion: Nivel de refrigerante (alarma o lectura)}
  nivel_aceite:              {fuente: vims, unidad: nivel, descripcion: Nivel de aceite del motor (alarma o lectura)}
  temp_admision:             {fuente: vims, unidad: "°C", descripcion: Temperatura del múltiple de admisión (IMAT)}
  presion_admision:          {fuente: vims, unidad: kPa, descripcion: Presión de admisión / boost (IMAP)}
  temp_escape:               {fuente: vims, unidad: "°C", descripcion: Temperatura de escape}
  temp_escape_diferencial:   {fuente: vims, unidad: "°C", descripcion: Diferencial de temperatura de escape entre bancadas o cilindros}
  restriccion_filtro_aire:   {fuente: vims, unidad: kPa, descripcion: Restricción del filtro de aire}

# Datos de contexto (no son señales del FMEA, pero el modelo los necesita)
contexto:
  horas_motor:        {fuente: horometro, unidad: h, descripcion: Horas acumuladas del motor instalado}
  horas_desde_cambio_aceite: {fuente: ot, unidad: h, descripcion: Horas desde el último cambio de aceite}
  modelo_equipo:      {fuente: ciclo_vida_componente, unidad: categoria, descripcion: "Modelo del camión (798 AC, 797F…)"}
  rellenos_aceite:    {fuente: rellenos, unidad: "volumen (POR_CONFIRMAR)", descripcion: Rellenos de aceite del motor (consumo)}

# Etiqueta del evento objetivo (ver definition.json)
etiqueta:
  evento: cambio_motor
  tipos: [imprevisto, programado]
  fuentes: [ciclo_vida_componente, ot, afa_rca]
  criterio: "Cambios de motor del listado histórico validado (docs/fase0/plantilla_eventos_motor.csv); AFA/RCA confirman la causa"
  censura: "motor aún en operación a la fecha de corte"
  ventanas_analisis: [T-90, T-60, T-30, T-15, T-7, T0]   # T0 = cambio de motor
